name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: |
            server/go.sum
            dispatcher/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The server embeds the SPA, so handler tests need a built static tree.
      - name: Build the web UI
        working-directory: web
        run: |
          npm ci --no-fund --no-audit
          npm run build

      - name: Check formatting
        run: test -z "$(gofmt -l ./server ./dispatcher)"

      - name: Vet
        run: go vet ./server/... ./dispatcher/...

      - name: Run tests
        run: go test -race ./server/... ./dispatcher/...

      - name: Install python3 and podman for the end-to-end runs
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 podman

      - name: Run end-to-end parity against the dispatcher
        run: go test ./dispatcher/e2e -count=1 -timeout 600s

  web:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci --no-fund --no-audit

      - name: Install browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        working-directory: web
        run: npm run lint

      - name: Run tests
        working-directory: web
        run: npm test

      - name: Build
        working-directory: web
        run: npm run build

  nix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Fails when package-lock.json changed without recomputing npmDepsHash.
      - name: Build the web derivation
        run: nix build .#web --no-link

      - name: Build the server derivation
        run: nix build .#server --no-link

      - name: Evaluate the NixOS module
        run: nix flake check --no-build
